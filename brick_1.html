<!doctype html>
<html lang="ar">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Brick Breaker Elite</title>
    <style>
        :root {
            --bg: #0a0e17;
            --panel: #161b22;
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.5);
            --danger: #ff4d4d;
            --success: #00ff88;
            --muted: #8b949e;
            --gold: #ffcc00;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: #f0f6fc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #wrap {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .game-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: auto;
            max-height: 70vh;
            border-radius: 12px;
            display: block;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 0 2px var(--accent);
        }

        .hud {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 10px;
            padding: 12px;
            background: var(--panel);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-item {
            text-align: center;
        }

        .hud-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .controls-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            border: none;
        }

        .touch-controls {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
            height: 80px;
        }

        .tbtn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.3);
        }

        .tbtn:active {
            background: rgba(0, 242, 255, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }

        @media (max-width: 768px) {
            .touch-controls {
                display: grid;
            }
            .hud-value {
                font-size: 14px;
            }
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 10, 20, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .card {
            background: var(--panel);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            max-width: 90%;
            width: 400px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .powerup-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            font-size: 12px;
            color: var(--muted);
        }

        .p-badge {
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .msg-pop {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px var(--accent);
            pointer-events: none;
            animation: popOut 1s ease-out forwards;
            z-index: 50;
        }

        @keyframes popOut {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -70%) scale(1); opacity: 0; }
        }
    </style>
</head>

<body>
    <audio id="hitSound" src="click.mp3" preload="auto"></audio>
    <audio id="levelUpSound" src="level_up.mp3" preload="auto"></audio>
    <audio id="loseSound" src="lose.mp3" preload="auto"></audio>

    <div id="wrap">
        <div class="hud">
            <div class="hud-item">
                <div class="hud-label">Score</div>
                <div class="hud-value" id="score">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Lives</div>
                <div class="hud-value" id="lives" style="color:var(--danger)">3</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Level</div>
                <div class="hud-value" id="level" style="color:var(--success)">1</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">High</div>
                <div class="hud-value" id="high" style="color:var(--gold)">0</div>
            </div>
        </div>

        <div class="game-container">
            <canvas id="game" width="900" height="600"></canvas>
            <div id="msgContainer"></div>
        </div>

        <div class="controls-row">
            <button class="btn" id="pauseBtn">Pause</button>
            <button class="btn" id="restartBtn">Restart</button>
        </div>

        <div class="touch-controls">
            <div id="leftTouch" class="tbtn">◀</div>
            <div id="rightTouch" class="tbtn">▶</div>
        </div>
    </div>

    <!-- Main Menu -->
    <div class="overlay" id="menu">
        <div class="card">
            <h1>BRICK BREAKER<br>ELITE</h1>
            <p style="color:var(--muted)">Destroy all bricks to advance levels.</p>
            
            <div class="powerup-info">
                <span class="p-badge" style="color:#00f2ff">⚡ Speed</span>
                <span class="p-badge" style="color:#ff4d4d">↔ Wide</span>
                <span class="p-badge" style="color:#00ff88">➕ Life</span>
                <span class="p-badge" style="color:#ffcc00">🔥 Multi</span>
            </div>

            <button class="btn btn-primary" id="startBtn" style="width:100%; padding:15px; font-size:18px">START MISSION</button>
            <button class="btn" id="leaderBtn" style="width:100%; margin-top:10px">LEADERBOARD</button>
        </div>
    </div>

    <!-- Leaderboard -->
    <div class="overlay" id="leaderOverlay" style="display:none">
        <div class="card">
            <h3>TOP SCORES</h3>
            <div id="board" style="margin:20px 0; font-size:20px; line-height:1.6"></div>
            <button class="btn" id="closeBoard" style="width:100%">BACK</button>
        </div>
    </div>

    <script>
        (() => {
            'use strict';

            const canvas = document.getElementById('game');
            const ctx = canvas.getContext('2d');
            const BASE_W = 900, BASE_H = 600;

            const hitSound = document.getElementById('hitSound');
            const levelUpSound = document.getElementById('levelUpSound');
            const loseSound = document.getElementById('loseSound');

            const menu = document.getElementById('menu');
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const restartBtn = document.getElementById('restartBtn');
            const leaderBtn = document.getElementById('leaderBtn');
            const leaderOverlay = document.getElementById('leaderOverlay');
            const closeBoard = document.getElementById('closeBoard');
            const boardDiv = document.getElementById('board');
            const msgContainer = document.getElementById('msgContainer');

            const scoreEl = document.getElementById('score');
            const livesEl = document.getElementById('lives');
            const levelEl = document.getElementById('level');
            const highEl = document.getElementById('high');

            let running = false, paused = false;
            let score = 0, lives = 3, level = 1, high = 0;
            let lastTime = 0;

            const paddle = {
                baseW: 140,
                w: 140,
                h: 16,
                x: 0,
                y: BASE_H - 40,
                vel: 0,
                speed: 12,
                color: '#00f2ff'
            };

            let balls = [];
            let bricks = [];
            let powerUps = [];
            let particles = [];

            const POWERUP_TYPES = [
                { type: 'wide', color: '#ff4d4d', label: 'WIDE PADDLE', action: () => { paddle.w = 220; setTimeout(() => paddle.w = paddle.baseW, 8000); } },
                { type: 'life', color: '#00ff88', label: 'EXTRA LIFE', action: () => { lives++; } },
                { type: 'multi', color: '#ffcc00', label: 'MULTI BALL', action: () => { spawnBall(true); spawnBall(true); } },
                { type: 'speed', color: '#00f2ff', label: 'PADDLE SPEED', action: () => { paddle.speed = 20; setTimeout(() => paddle.speed = 12, 8000); } }
            ];

            function init() {
                high = parseInt(localStorage.getItem('bb_high_elite') || '0', 10);
                highEl.textContent = high;
                applyScaling();
                window.addEventListener('resize', applyScaling);
                resetBallAndPaddle();
                createBricks();
            }

            function applyScaling() {
                const container = canvas.parentElement;
                const cw = container.clientWidth;
                const ch = container.clientHeight;
                const ratio = BASE_W / BASE_H;
                
                let w = cw;
                let h = cw / ratio;
                
                if (h > ch) {
                    h = ch;
                    w = ch * ratio;
                }
                
                canvas.style.width = Math.floor(w) + 'px';
                canvas.style.height = Math.floor(h) + 'px';
            }

            function spawnBall(isExtra = false) {
                const b = {
                    r: 8,
                    x: isExtra ? balls[0].x : BASE_W / 2,
                    y: isExtra ? balls[0].y : BASE_H - 60,
                    vx: (Math.random() - 0.5) * 8,
                    vy: -6 - (level * 0.5),
                    color: isExtra ? '#ffcc00' : '#fff'
                };
                balls.push(b);
            }

            function resetBallAndPaddle() {
                paddle.x = (BASE_W - paddle.w) / 2;
                paddle.w = paddle.baseW;
                paddle.speed = 12;
                balls = [];
                spawnBall();
                powerUps = [];
            }

            function createBricks() {
                bricks = [];
                const rows = 3 + level;
                const cols = 10;
                const w = 75, h = 25, gap = 8;
                const offsetX = (BASE_W - (cols * (w + gap))) / 2;
                const offsetY = 60;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        let hp = 1;
                        if (r === 0) hp = 3;
                        else if (r < 2) hp = 2;
                        
                        // Level patterns
                        if (level === 2 && (r+c)%2 === 0) continue;
                        if (level === 3 && Math.abs(c-4.5) > r) continue;

                        bricks.push({
                            x: offsetX + c * (w + gap),
                            y: offsetY + r * (h + gap),
                            w: w, h: h,
                            hp: hp,
                            maxHp: hp,
                            alive: true
                        });
                    }
                }
            }

            function createParticles(x, y, color, count = 8) {
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: x, y: y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        r: Math.random() * 3 + 1,
                        life: 1.0,
                        color: color
                    });
                }
            }

            function showMsg(txt) {
                const el = document.createElement('div');
                el.className = 'msg-pop';
                el.textContent = txt;
                msgContainer.appendChild(el);
                setTimeout(() => el.remove(), 1000);
            }

            function update(dt) {
                if (!running || paused) return;

                // Paddle
                paddle.x += paddle.vel * paddle.speed * dt * 60;
                paddle.x = Math.max(0, Math.min(BASE_W - paddle.w, paddle.x));

                // Balls
                for (let i = balls.length - 1; i >= 0; i--) {
                    const b = balls[i];
                    b.x += b.vx * dt * 60;
                    b.y += b.vy * dt * 60;

                    // Wall bounce
                    if (b.x - b.r < 0 || b.x + b.r > BASE_W) {
                        b.vx *= -1;
                        b.x = b.x < b.r ? b.r : BASE_W - b.r;
                        playSound(hitSound);
                    }
                    if (b.y - b.r < 0) {
                        b.vy *= -1;
                        b.y = b.r;
                        playSound(hitSound);
                    }

                    // Paddle bounce
                    if (b.y + b.r > paddle.y && b.y - b.r < paddle.y + paddle.h &&
                        b.x > paddle.x && b.x < paddle.x + paddle.w) {
                        const hitPos = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
                        const angle = hitPos * Math.PI / 3;
                        const speed = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
                        b.vx = speed * Math.sin(angle);
                        b.vy = -Math.abs(speed * Math.cos(angle));
                        b.y = paddle.y - b.r;
                        playSound(hitSound);
                        createParticles(b.x, b.y, paddle.color, 5);
                    }

                    // Bricks
                    for (const brick of bricks) {
                        if (!brick.alive) continue;
                        if (b.x + b.r > brick.x && b.x - b.r < brick.x + brick.w &&
                            b.y + b.r > brick.y && b.y - b.r < brick.y + brick.h) {
                            
                            // Determine side
                            const dx = Math.abs(b.x - (brick.x + brick.w / 2)) / brick.w;
                            const dy = Math.abs(b.y - (brick.y + brick.h / 2)) / brick.h;
                            if (dx > dy) b.vx *= -1; else b.vy *= -1;

                            brick.hp--;
                            score += 10;
                            playSound(hitSound);
                            createParticles(b.x, b.y, '#fff', 4);

                            if (brick.hp <= 0) {
                                brick.alive = false;
                                score += 50;
                                createParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, '#00f2ff', 12);
                                if (Math.random() < 0.15) {
                                    const pType = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
                                    powerUps.push({
                                        x: brick.x + brick.w / 2,
                                        y: brick.y + brick.h / 2,
                                        r: 12,
                                        vy: 3,
                                        ...pType
                                    });
                                }
                            }
                            break;
                        }
                    }

                    // Death
                    if (b.y - b.r > BASE_H) {
                        balls.splice(i, 1);
                        if (balls.length === 0) {
                            lives--;
                            playSound(loseSound);
                            if (lives <= 0) endGame();
                            else resetBallAndPaddle();
                        }
                    }
                }

                // Powerups
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const p = powerUps[i];
                    p.y += p.vy;
                    if (p.y - p.r > BASE_H) powerUps.splice(i, 1);
                    else if (p.y + p.r > paddle.y && p.x > paddle.x && p.x < paddle.x + paddle.w) {
                        p.action();
                        showMsg(p.label);
                        powerUps.splice(i, 1);
                        playSound(levelUpSound);
                    }
                }

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx; p.y += p.vy;
                    p.life -= 0.02;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                // Win
                if (bricks.every(b => !b.alive)) {
                    running = false;
                    level++;
                    showMsg("LEVEL " + level);
                    playSound(levelUpSound);
                    setTimeout(() => {
                        createBricks();
                        resetBallAndPaddle();
                        running = true;
                    }, 1500);
                }

                scoreEl.textContent = score;
                livesEl.textContent = lives;
                levelEl.textContent = level;
                if (score > high) {
                    high = score;
                    localStorage.setItem('bb_high_elite', high);
                    highEl.textContent = high;
                }
            }

            function draw() {
                ctx.fillStyle = '#050a14';
                ctx.fillRect(0, 0, BASE_W, BASE_H);

                // Grid
                ctx.strokeStyle = 'rgba(0, 242, 255, 0.05)';
                ctx.lineWidth = 1;
                for(let i=0; i<BASE_W; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,BASE_H); ctx.stroke(); }
                for(let i=0; i<BASE_H; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(BASE_W,i); ctx.stroke(); }

                // Bricks
                for (const b of bricks) {
                    if (!b.alive) continue;
                    const hue = 180 + (b.hp * 40);
                    ctx.fillStyle = `hsl(${hue}, 80%, 50%)`;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = ctx.fillStyle;
                    roundRect(ctx, b.x, b.y, b.w, b.h, 4);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    // HP indicator
                    if (b.maxHp > 1) {
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.fillRect(b.x + 5, b.y + b.h - 6, (b.w - 10) * (b.hp / b.maxHp), 3);
                    }
                }

                // Paddle
                ctx.fillStyle = paddle.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = paddle.color;
                roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 8);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Balls
                for (const b of balls) {
                    ctx.fillStyle = b.color;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = b.color;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // Powerups
                for (const p of powerUps) {
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                }

                // Particles
                for (const p of particles) {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            function roundRect(ctx, x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r);
                ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r);
                ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }

            function playSound(s) {
                try { s.currentTime = 0; s.play(); } catch(e) {}
            }

            function loop(ts) {
                const dt = Math.min(0.033, (ts - lastTime) / 1000);
                lastTime = ts;
                update(dt);
                draw();
                requestAnimationFrame(loop);
            }

            function endGame() {
                running = false;
                saveScore();
                menu.style.display = 'flex';
                document.querySelector('h1').innerHTML = "GAME OVER<br>SCORE: " + score;
                document.getElementById('startBtn').textContent = "TRY AGAIN";
            }

            function saveScore() {
                const scores = JSON.parse(localStorage.getItem('bb_scores_elite') || '[]');
                scores.push({s: score, d: new Date().toLocaleDateString()});
                scores.sort((a,b) => b.s - a.s);
                localStorage.setItem('bb_scores_elite', JSON.stringify(scores.slice(0, 5)));
            }

            // Controls
            window.addEventListener('keydown', e => {
                if (e.key === 'ArrowLeft') paddle.vel = -1;
                if (e.key === 'ArrowRight') paddle.vel = 1;
                if (e.key === ' ') paused = !paused;
            });
            window.addEventListener('keyup', e => {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') paddle.vel = 0;
            });

            // Mouse/Touch
            const movePaddle = (clientX) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = BASE_W / rect.width;
                const x = (clientX - rect.left) * scaleX;
                paddle.x = Math.max(0, Math.min(BASE_W - paddle.w, x - paddle.w / 2));
            };

            canvas.addEventListener('mousemove', e => movePaddle(e.clientX));
            canvas.addEventListener('touchmove', e => { e.preventDefault(); movePaddle(e.touches[0].clientX); });

            document.getElementById('leftTouch').addEventListener('touchstart', (e) => { e.preventDefault(); paddle.vel = -1; });
            document.getElementById('leftTouch').addEventListener('touchend', () => paddle.vel = 0);
            document.getElementById('rightTouch').addEventListener('touchstart', (e) => { e.preventDefault(); paddle.vel = 1; });
            document.getElementById('rightTouch').addEventListener('touchend', () => paddle.vel = 0);

            startBtn.addEventListener('click', () => {
                score = 0; lives = 3; level = 1;
                createBricks();
                resetBallAndPaddle();
                menu.style.display = 'none';
                running = true;
            });

            pauseBtn.addEventListener('click', () => {
                paused = !paused;
                pauseBtn.textContent = paused ? "Resume" : "Pause";
            });

            restartBtn.addEventListener('click', () => {
                if(confirm("Restart game?")) {
                    score = 0; lives = 3; level = 1;
                    createBricks();
                    resetBallAndPaddle();
                    running = true;
                }
            });

            leaderBtn.addEventListener('click', () => {
                const scores = JSON.parse(localStorage.getItem('bb_scores_elite') || '[]');
                boardDiv.innerHTML = scores.length ? 
                    scores.map((s, i) => `<div>#${i+1} - ${s.s} <span style="font-size:12px;color:var(--muted)">${s.d}</span></div>`).join('') :
                    "No scores yet";
                leaderOverlay.style.display = 'flex';
            });

            closeBoard.addEventListener('click', () => leaderOverlay.style.display = 'none');

            init();
            requestAnimationFrame(loop);
        })();
    </script>
</body>

</html>
